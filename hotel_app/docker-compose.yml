version: '3'

services:
  web:
    build: .
    command: uvicorn main:booking_app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - db
    environment:
      DATABASE_URL : postgres://postgres:postgres@db:5432/postgres

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: